name: Build Jujutsu NPC Compatibility
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Verify Forge project uploaded
        run: |
          test -f build.gradle || { echo "::error::Project source has not been uploaded yet (missing build.gradle)."; exit 1; }
          test -f settings.gradle || { echo "::error::Missing settings.gradle."; exit 1; }
      - name: Validate structure suppression data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('src/main/resources/data/jujutsucraft/worldgen')
          assert not list((root/'structure').glob('*.json')), 'Unsafe structure-definition overrides present'
          sets = list((root/'structure_set').glob('*.json'))
          assert len(sets) == 16, f'Expected 16 disabled sets, got {len(sets)}'
          for path in sets:
              obj = json.loads(path.read_text())
              assert obj['placement']['frequency'] == 0, path
              assert obj['placement']['type'] == 'minecraft:random_spread', path
          print(f'Validated {len(sets)} JJK structure-set overrides')
          PY
      - name: Compile Forge mod
        run: gradle --no-daemon --stacktrace clean build
      - name: Validate compiled mod is not empty
        run: |
          jar tf build/libs/jujutsu-npc-compat-*.jar | grep -q 'dev/jujutsunpc/JujutsuNpcCompatMod.class'
          jar tf build/libs/jujutsu-npc-compat-*.jar | grep -q 'data/jujutsucraft/worldgen/structure_set/gymnasium.json'
      - name: Upload compiled JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jujutsu-npc-compat-jar
          path: build/libs/*.jar
          if-no-files-found: error
