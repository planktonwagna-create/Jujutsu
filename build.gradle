plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.10.0-animation-domain-test'
group = 'dev.jujutsunpc'
base { archivesName = 'jujutsu-npc-compat' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { jujutsunpccompat { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { jujutsunpccompat { source sourceSets.main } }
        }
    }
}
repositories { maven { url = 'https://maven.minecraftforge.net' } }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.26' }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    manifest { attributes(['Specification-Title':'jujutsunpccompat', 'Specification-Version':'1',
         'Implementation-Title':project.name, 'Implementation-Version':project.version, 'MixinConfigs':'jujutsunpccompat.mixins.json']) }
    finalizedBy 'reobfJar'
}
